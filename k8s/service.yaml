# Service NodePort (decyzja autora 18.10): ruch przez kube-proxy rozkładany na obie repliki.
# Dostęp z hosta: 127.0.0.1:8081 → węzeł kind :30080 (k8s/kind/cluster.yaml) → pody :8000.
apiVersion: v1
kind: Service
metadata:
  name: banking77-intent-api
  labels:
    app: banking77-intent-api
spec:
  type: NodePort
  selector:
    app: banking77-intent-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080  # = containerPort w extraPortMappings klastra kind
