name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # przypięte na czas projektu: ubuntu-latest przechodzi na Ubuntu 26.04 od 19.10.2026
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests + coverage
        run: uv run pytest --cov=banking77_intent_ml --cov-report=term --cov-report=xml
