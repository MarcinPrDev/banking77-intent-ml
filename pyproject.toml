[project]
name = "banking77-intent-ml"
version = "0.1.0"
description = "Klasyfikacja zgloszen na BANKING77 (77 intencji): TF-IDF+LR vs zamrozone embeddingi+kNN vs DistilBERT — jakosc, koszt i wdrozenie (FastAPI, Docker, kind). Projekt koncowy kursu AI & ML Engineering (SAGES/Kodolamacz)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Marcin Proch" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "optuna>=3.6",
    "mlflow>=2.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "joblib>=1.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbstripout>=0.9.1",
]
nlp = ["sentence-transformers>=3.0"]
llm = [
    "groq>=0.9",
    "litellm>=1.91.0",
]
# RTX 5080 = Blackwell/sm_120: torch MUSI pochodzić z indeksu cu128 (patrz [tool.uv.sources]);
# koło z PyPI (CPU/starsze CUDA) nie zobaczy karty. Środowisko lokalne — zawsze pełna lista extras
# (`uv sync` jest exact, pominięte extras są usuwane): uv sync --extra dev --extra nlp --extra gpu --extra serving
gpu = [
    "accelerate>=1.1.0",
    "torch>=2.7",
    "transformers>=4.44",
]
# API (od W2): FastAPI + uvicorn; httpx jest wymagany przez TestClient. Bez torcha — obraz Docker
# z modelem wymagającym torcha dostaje extra `cpu` (ADR-0003: DistilBERT).
serving = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.49.0",
]
# Obraz serwujący (W3, ADR-0003): torch z indeksu CPU — bez CUDA i pakietów nvidia-* (koło z PyPI
# na Linuksie zawiera CUDA). Rozłączny z `gpu` ([tool.uv] conflicts); w obrazie:
# uv sync --frozen --no-dev --extra serving --extra cpu
cpu = [
    "torch==2.11.0",                     # ta sama wersja co trening i ocena na teście (2.11.0+cu128)
    "transformers>=4.44",
]

[tool.uv]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "cpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "gpu" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
