[project]
name = "banking77-intent-ml"
version = "0.1.0"
description = "Klasyfikacja zgloszen na BANKING77 (77 intencji): TF-IDF+LR vs zamrozone embeddingi+kNN vs DistilBERT — jakosc, koszt i wdrozenie (FastAPI, Docker, kind). Projekt koncowy kursu AI & ML Engineering (SAGES/Kodolamacz)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Marcin Proch" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "optuna>=3.6",
    "mlflow>=2.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "jupyterlab>=4.2", "ipykernel>=6.29"]
nlp = ["sentence-transformers>=3.0"]
llm = [
    "groq>=0.9",
    "litellm>=1.91.0",
]
# RTX 5080 = Blackwell/sm_120: torch MUSI pochodzić z indeksu cu128 (patrz [tool.uv.sources]);
# koło z PyPI (CPU/starsze CUDA) nie zobaczy karty. Środowisko lokalne — zawsze pełna lista extras
# (`uv sync` jest exact, pominięte extras są usuwane): uv sync --extra dev --extra nlp --extra gpu --extra serving
gpu = ["torch>=2.7", "transformers>=4.44"]
# API (od W2): FastAPI + uvicorn; httpx jest wymagany przez TestClient. Bez torcha — obraz Docker
# z modelem wymagającym torcha dostanie osobny extra z indeksem CPU (decyzja w W3).
serving = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.49.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
